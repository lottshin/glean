name: Feature request
description: Suggest a focused improvement to the Glean workflow
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the learning workflow or limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what Glean should do and where it should happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: data
    attributes:
      label: Data ownership
      options:
        - label: The proposal keeps user learning data readable as ordinary files.
          required: true
